name: windows_vpn
services:
  container:
    image: dockurr/windows:latest
    container_name: windows
    environment:
      VERSION: "10"
    devices:
      - /dev/kvm
      - /dev/net/tun
    cap_add:
      - NET_ADMIN
    # ports:
    #   - 8007:8006
    #   - 3390:3389/tcp
    #   - 3390:3389/udp
    #   - "51820:51820/udp"  # WireGuard -> Windows VM
    networks:
      windows_vpn_net:
        ipv4_address: 172.30.0.2
    volumes:
      - ./windows:/storage
      - /home/mio/code/windows_testing/share:/shared
    restart: always
    stop_grace_period: 2m

networks:
  windows_vpn_net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.0.0/24

